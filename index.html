function gra(){const o=store.get('last',{n:'000000',num:'',tipo:'boleta'}),t=o.tipo=='factura'?'factura':'boleta';return[10,'Compra finalizada',`<div class="ok-box"><i>✓</i><h1 style="margin-top:12px">¡Gracias por tu compra!</h1><p class="mut">Tu pedido ha sido realizado con éxito.</p><div class="n"><b>Número de pedido: #${o.n}</b><br><small class="mut">${t[0].toUpperCase()+t.slice(1)} ${o.num} · Entrega estimada: 24 a 48 h</small></div><div style="max-width:340px;margin:auto"><button class="btn" onclick="pdf(0)">⬇ Descargar ${t} (PDF)</button><p><a href="#/cuenta" style="color:var(--g)">Ver mis pedidos</a> · <a href="#/categorias" style="color:var(--g)">Seguir comprando</a></p></div></div>`]}
function cue(){const o=store.get('orders',[]);return[0,'Mi cuenta',`<div class="box"><h3>Mis pedidos</h3>${o.length?o.map((x,i)=>`<p class="ped"><span>#${x.n} · ${x.fecha} · ${x.tipo=='factura'?'Factura':'Boleta'} ${x.num||''}<br><small class="mut">${x.pago||''}</small></span><span><b>${money(x.total)}</b> <button class="x" onclick="pdf(${i})">⬇ PDF</button></span></p>`).join(''):'<p class="mut">Aún no tienes pedidos.</p>'}</div>`]}
// Aviso flotante de productos por agotarse (aparece al abrir la página)
let avisoOff=false;try{avisoOff=sessionStorage.getItem('aviso')=='1'}catch{}
function cerrarAviso(){avisoOff=true;try{sessionStorage.setItem('aviso','1')}catch{}const e=$('#aviso');if(e)e.remove()}
function showAviso(){const l=lowList().filter(p=>p.s>=1).slice(0,4);if(avisoOff||!l.length||$('#aviso'))return;const d=document.createElement('div');d.id='aviso';d.className='aviso';
 d.innerHTML=`<button onclick="cerrarAviso()">×</button><b>⚠ ¡Se están agotando!</b><p>Estos productos tienen pocas unidades:</p>${l.map(p=>`<a href="#/producto/${p.id}"><span class="mini" style="background:${C(p.c).col}">${pic(p)}</span>${p.n}<em>quedan ${p.s}</em></a>`).join('')}`;document.body.appendChild(d);setTimeout(()=>d.remove(),15000)}
// Inventario y alertas de poco stock (se activa al entrar a #/admin)
const lowList=()=>prods.filter(p=>p.s<=10).sort((a,b)=>a.s-b.s), lvl=p=>p.s<1?['out','Agotado']:p.s<=5?['crit','Crítico']:['low','Bajo'];
const banner=()=>{const n=store.get('admin',false)?lowList().length:0;return n?`<div class="alertb">⚠ Alerta de inventario: ${n} producto${n>1?'s':''} con poco stock · <a href="#/admin">Ver inventario</a></div>`:''};
function inv(){const l=lowList(),c=f=>prods.filter(f).length;return[0,'Inventario · Alertas de stock',`<div class="kpis"><div class="kpi out"><b>${c(p=>p.s<1)}</b>Agotados</div><div class="kpi crit"><b>${c(p=>p.s>=1&&p.s<=5)}</b>Críticos (1-5)</div><div class="kpi low"><b>${c(p=>p.s>5&&p.s<=10)}</b>Bajos (6-10)</div></div>${l.length?l.map(p=>{const[k,t]=lvl(p);return`<div class="irow"><span class="mini" style="background:${C(p.c).col}">${pic(p)}</span><div style="flex:1"><b>${p.n}</b><br><small class="mut">${C(p.c).n}</small></div><div class="bar"><i class="${k}" style="width:${Math.max(p.s*10,4)}%"></i></div><span class="chip ${k}">${t} · ${p.s}</span></div>`}).join(''):'<p class="ok">✓ Todos los productos tienen buen stock.</p>'}<p class="mut" style="margin-top:14px">Para reponer, edita la columna <b>stock</b> en Supabase (Table Editor → productos). <a href="#/" onclick="store.set('admin',false)" style="color:var(--g)">Salir del modo inventario</a></p>`]}

/* ===== 8. ENRUTADOR (cambia de pantalla según el # de la URL) ===== */
function render(){clearInterval(tm);if(location.hash=='#/admin')store.set('admin',true);const [,p='',a='']=location.hash.slice(1).split('/');
  const R={'':home,categorias:cat,producto:prod,ofertas:ofer,nosotros:nos,contacto:con,carrito:car,pago:pay,gracias:gra,cuenta:cue,buscar:bus,admin:inv};
  $('#app').innerHTML=layout(p,(R[p]||home)(decodeURIComponent(a)));scrollTo(0,0);if(p=='ofertas')timer()}
addEventListener('hashchange',render);load().then(()=>{render();showAviso()});render();
